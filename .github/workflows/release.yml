# Builds the release downloads and publishes them as a GitHub release. Start it either way:
#   - on GitHub: Actions > Release > Run workflow, and type the version (e.g. 1.2.0): the tag v1.2.0 is created on the
#     chosen branch's latest commit;
#   - or push a version tag: git tag v1.2.0 && git push origin v1.2.0
# A release that already exists for the tag (e.g. made by hand on the Releases page) gets the files attached instead.
# Release notes come from .github/release-notes/<tag>.md when that file exists; otherwise GitHub writes them from the
# commits. The builds are self-contained (.NET included), so users need nothing installed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (the tag will be v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version and tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then v="${INPUT_VERSION#v}"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$v' is not a version like 1.2.0"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Publish Windows x64 and Linux x64
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish ByteExplorer.csproj -c Release -r "$rid" --self-contained true \
              -p:Version="$VERSION" -o "out/ByteExplorer-$VERSION-$rid"
          done
          find out -name '*.pdb' -delete

      - name: Package
        run: |
          mkdir assets
          (cd out && zip -q -r -9 "../assets/ByteExplorer-$VERSION-win-x64.zip" "ByteExplorer-$VERSION-win-x64")
          tar -C out -czf "assets/ByteExplorer-$VERSION-linux-x64.tar.gz" --owner=0 --group=0 "ByteExplorer-$VERSION-linux-x64"

      # The Windows build includes VLC (LGPL 2.1+, some plugins GPL 2.0+): its source is published with the release,
      # as THIRD-PARTY-NOTICES.md promises. The version is the one the build restored.
      - name: VLC source
        run: |
          VLC=$(jq -r '.libraries | keys[] | select(startswith("VideoLAN.LibVLC.Windows/")) | split("/")[1]' obj/project.assets.json)
          echo "VLC $VLC"
          base="https://download.videolan.org/pub/videolan/vlc/$VLC"
          curl -sSfL -o "assets/vlc-$VLC.tar.xz" "$base/vlc-$VLC.tar.xz"
          expected=$(curl -sSfL "$base/vlc-$VLC.tar.xz.sha256" | cut -d' ' -f1)
          echo "$expected  assets/vlc-$VLC.tar.xz" | sha256sum -c -

      - name: Checksums
        run: (cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          # From a tag push the tag exists; from Run workflow it is created on the commit that was built.
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" --title "ByteExplorer $VERSION" "$@"
