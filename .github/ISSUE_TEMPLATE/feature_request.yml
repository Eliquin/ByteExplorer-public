name: Feature request
description: An idea to make ByteExplorer better
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and how you would use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem would it solve, or what would it make easier?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you use today instead?
      description: Another app or a workaround, if any.
