# Builds the release downloads and publishes them as a GitHub release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# Release notes come from .github/release-notes/<tag>.md when that file exists; otherwise GitHub writes them from the
# commits. The builds are self-contained (.NET included), so users need nothing installed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish Windows x64 and Linux x64
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish ByteExplorer.csproj -c Release -r "$rid" --self-contained true \
              -p:Version="$VERSION" -o "out/ByteExplorer-$VERSION-$rid"
          done
          find out -name '*.pdb' -delete

      - name: Package
        run: |
          mkdir assets
          (cd out && zip -q -r -9 "../assets/ByteExplorer-$VERSION-win-x64.zip" "ByteExplorer-$VERSION-win-x64")
          tar -C out -czf "assets/ByteExplorer-$VERSION-linux-x64.tar.gz" --owner=0 --group=0 "ByteExplorer-$VERSION-linux-x64"

      # The Windows build includes VLC (LGPL 2.1+, some plugins GPL 2.0+): its source is published with the release,
      # as THIRD-PARTY-NOTICES.md promises. The version is the one the build restored.
      - name: VLC source
        run: |
          VLC=$(jq -r '.libraries | keys[] | select(startswith("VideoLAN.LibVLC.Windows/")) | split("/")[1]' obj/project.assets.json)
          echo "VLC $VLC"
          base="https://download.videolan.org/pub/videolan/vlc/$VLC"
          curl -sSfL -o "assets/vlc-$VLC.tar.xz" "$base/vlc-$VLC.tar.xz"
          expected=$(curl -sSfL "$base/vlc-$VLC.tar.xz.sha256" | cut -d' ' -f1)
          echo "$expected  assets/vlc-$VLC.tar.xz" | sha256sum -c -

      - name: Checksums
        run: (cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "ByteExplorer $VERSION" "$@"
